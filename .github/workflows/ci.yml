name: CI

on:
  schedule:
    - cron: '0 5 * * *'
      timezone: America/New_York
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  workflow_dispatch:
    inputs:
      test_profile:
        description: Test coverage profile; full includes unused-feature coverage
        required: true
        type: choice
        options: [normal, full]
        default: normal
      group_size:
        description: Selections per fresh SwiftPM process
        required: true
        type: choice
        options: ['4', '12']
        default: '4'
      shard_count:
        description: Complete macOS shard count
        required: true
        type: choice
        options: ['1', '2', '3']
        default: '2'
      expected_sha:
        description: Exact lowercase commit SHA of the selected ref
        required: true
        type: string
      cache_mode:
        description: macOS cache only; seed permits a miss, warm requires an exact hit, cold bypasses cache
        required: true
        type: choice
        options: [seed, warm, cold]
        default: seed
      linux_cache_mode:
        description: Linux application cache only; off bypasses, seed permits a miss, warm requires an exact hit
        required: true
        type: choice
        options: ['off', seed, warm]
        default: 'off'
      linux_timestamp_mode:
        description: Experimental Linux inputs; record with seed, replay with exact warm, off leaves timestamps alone
        required: true
        type: choice
        options: ['off', record, replay]
        default: 'off'

concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && format('ci-manual-{0}-{1}-{2}-{3}', github.workflow, github.ref, github.run_id, github.run_attempt) || github.event_name == 'schedule' && format('ci-nightly-{0}-{1}', github.workflow, github.ref) || format('ci-{0}-{1}', github.workflow, github.ref) }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

env:
  CODEXBAR_TEST_PROFILE: ${{ github.event_name == 'workflow_dispatch' && inputs.test_profile || 'normal' }}
  SWIFT_VERSION: 6.3.3
  SWIFTLY_VERSION: 1.1.3
  SWIFTLY_SIGNING_FINGERPRINT: E813C892820A6FA13755B268F167DF1ACF9CE069

jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      macos-tests: ${{ steps.macos-tests.outputs.macos-tests }}
      macos-tests-deferred: ${{ steps.macos-tests.outputs.macos-tests-deferred }}
      macos-tests-reason: ${{ steps.macos-tests.outputs.macos-tests-reason }}
      changed-path-count: ${{ steps.macos-tests.outputs.changed-path-count }}
      linux-tests: ${{ steps.linux-tests.outputs.linux-tests }}
      linux-tests-reason: ${{ steps.linux-tests.outputs.linux-tests-reason }}
      linux-musl-build: ${{ steps.linux-musl-build.outputs.linux-musl-build }}
      linux-musl-build-reason: ${{ steps.linux-musl-build.outputs.linux-musl-build-reason }}
      macos-matrix: ${{ steps.campaign.outputs.matrix }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Validate campaign controls
        id: campaign
        env:
          CAMPAIGN_GROUP_SIZE: ${{ inputs.group_size }}
          CAMPAIGN_SHARD_COUNT: ${{ inputs.shard_count }}
          CAMPAIGN_EXPECTED_SHA: ${{ inputs.expected_sha }}
          CAMPAIGN_CACHE_MODE: ${{ inputs.cache_mode }}
          LINUX_CACHE_MODE: ${{ inputs.linux_cache_mode || 'off' }}
          LINUX_TIMESTAMP_MODE: ${{ inputs.linux_timestamp_mode || 'off' }}
        run: python3 Scripts/ci_swift_test_campaign.py plan

      - name: Detect macOS test impact
        id: macos-tests
        shell: bash
        env:
          CI_PULL_REQUEST_DRAFT: ${{ github.event.pull_request.draft || false }}
        run: |
          set -euo pipefail

          changed_paths="${RUNNER_TEMP}/changed-paths.txt"
          # Empty or unavailable evidence selects every platform; manual runs always qualify all.
          : > "$changed_paths"
          base_sha=''
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base_sha="${{ github.event.pull_request.base.sha }}"
          elif [[ "${{ github.event_name }}" == "push" ]]; then
            base_sha="${{ github.event.before }}"
          fi
          if [[ "${{ github.event_name }}" != "workflow_dispatch" ]]; then
            if [[ -n "$base_sha" && ! "$base_sha" =~ ^0+$ ]] && git cat-file -e "${base_sha}^{commit}" 2>/dev/null; then
              git diff --name-status "$base_sha" "$GITHUB_SHA" > "$changed_paths"
            else
              echo "Base commit unavailable; selecting all platforms conservatively."
            fi
          fi

          printf 'Changed paths:\n'
          sed 's/^/- /' "$changed_paths"
          ./Scripts/ci_macos_test_gate.sh "$changed_paths"

      - name: Detect Linux glibc test impact
        id: linux-tests
        shell: bash
        run: ./Scripts/ci_linux_test_gate.sh "$RUNNER_TEMP/changed-paths.txt"

      - name: Detect Linux musl build impact
        id: linux-musl-build
        shell: bash
        run: ./Scripts/ci_linux_musl_build_gate.sh "$RUNNER_TEMP/changed-paths.txt"

      - name: Summarize CI path gates
        if: ${{ always() }}
        shell: bash
        env:
          MACOS_TESTS: ${{ steps.macos-tests.outputs.macos-tests }}
          MACOS_TESTS_REASON: ${{ steps.macos-tests.outputs.macos-tests-reason }}
          CHANGED_PATH_COUNT: ${{ steps.macos-tests.outputs.changed-path-count }}
          LINUX_TESTS: ${{ steps.linux-tests.outputs.linux-tests }}
          LINUX_TESTS_REASON: ${{ steps.linux-tests.outputs.linux-tests-reason }}
          LINUX_MUSL_BUILD: ${{ steps.linux-musl-build.outputs.linux-musl-build }}
          LINUX_MUSL_BUILD_REASON: ${{ steps.linux-musl-build.outputs.linux-musl-build-reason }}
        run: |
          set -euo pipefail
          reason="${MACOS_TESTS_REASON:-<unset>}"
          reason="${reason//|/\\|}"
          linux_reason="${LINUX_TESTS_REASON:-<unset>}"
          linux_reason="${linux_reason//|/\\|}"
          musl_reason="${LINUX_MUSL_BUILD_REASON:-<unset>}"
          musl_reason="${musl_reason//|/\\|}"
          {
            printf '### CI path gates\n\n'
            printf '| Field | Value |\n'
            printf '| --- | --- |\n'
            printf '| macOS Swift tests required | `%s` |\n' "${MACOS_TESTS:-<unset>}"
            printf '| macOS reason | %s |\n' "$reason"
            printf '| Linux glibc tests required | `%s` |\n' "${LINUX_TESTS:-<unset>}"
            printf '| Linux glibc reason | %s |\n' "$linux_reason"
            printf '| Linux musl build required | `%s` |\n' "${LINUX_MUSL_BUILD:-<unset>}"
            printf '| Linux musl reason | %s |\n' "$musl_reason"
            printf '| Changed path entries | `%s` |\n' "${CHANGED_PATH_COUNT:-<unset>}"
          } >> "$GITHUB_STEP_SUMMARY"

  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install lint tools
        run: ./Scripts/install_lint_tools.sh swiftlint oxlint oxfmt typescript

      - name: Lint
        run: ./Scripts/lint.sh lint-linux

  swift-build-macos:
    needs: changes
    if: ${{ needs.changes.outputs.macos-tests == 'true' && needs.changes.outputs.macos-tests-deferred != 'true' }}
    runs-on: macos-26
    timeout-minutes: 80
    outputs:
      artifact-id: ${{ steps.build-upload.outputs.artifact-id }}
      manifest-sha256: ${{ steps.swift-build.outputs.manifest-sha256 }}
      cache-hit: ${{ steps.swift-cache.outputs.cache-hit }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Select Xcode 26.3 or 26.2
        run: |
          set -euo pipefail
          # Both versions are part of the official macOS 26 runner image.
          for candidate in /Applications/Xcode_26.3.app /Applications/Xcode_26.2.app; do
            if [[ -d "$candidate" ]]; then
              export DEVELOPER_DIR="${candidate}/Contents/Developer"
              echo "DEVELOPER_DIR=$DEVELOPER_DIR" >> "$GITHUB_ENV"
              break
            fi
          done
          [[ "$(/usr/bin/xcodebuild -version)" == Xcode\ 26.* ]]
          /usr/bin/xcodebuild -version

      - name: Swift toolchain version
        id: swift-toolchain
        shell: bash
        run: |
          set -euo pipefail
          xcode_version="$(/usr/bin/xcodebuild -version)"
          swift_version="$(swift --version)"
          swiftpm_version="$(swift package --version)"
          toolchain_info="$(printf '%s\n' "$xcode_version" "$swift_version" "$swiftpm_version")"
          printf '%s\n' "$toolchain_info"
          cache_id="$(printf '%s\n' "$toolchain_info" | shasum -a 256 | awk '{print $1}')"
          printf 'cache-id=%s\n' "$cache_id" >> "$GITHUB_OUTPUT"
          profile_manifest_sha256="$(python3 -c 'import sys; sys.path.insert(0, "Scripts"); from test_profiles import manifest_digest; print(manifest_digest())')"
          printf 'profile-manifest-sha256=%s\n' "$profile_manifest_sha256" >> "$GITHUB_OUTPUT"

      - name: Restore SwiftPM build cache
        id: swift-cache
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.cache_mode != 'cold' }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .build
            ~/Library/Caches/org.swift.swiftpm
          # Save source builds after a revision changes; an exact dependency-only
          # hit never refreshed them. SwiftPM still validates every restored build.
          key: swiftpm-macos26-v3-${{ runner.arch }}-${{ steps.swift-toolchain.outputs.cache-id }}-${{ env.CODEXBAR_TEST_PROFILE }}-${{ steps.swift-toolchain.outputs.profile-manifest-sha256 }}-${{ hashFiles('Package.resolved', 'Package.swift') }}-${{ github.sha }}
          restore-keys: |
            swiftpm-macos26-v3-${{ runner.arch }}-${{ steps.swift-toolchain.outputs.cache-id }}-${{ env.CODEXBAR_TEST_PROFILE }}-${{ steps.swift-toolchain.outputs.profile-manifest-sha256 }}-${{ hashFiles('Package.resolved', 'Package.swift') }}-

      - name: Require an exact cache hit for a warm campaign
        env:
          CACHE_MODE: ${{ inputs.cache_mode }}
          CACHE_HIT: ${{ steps.swift-cache.outputs.cache-hit }}
        run: |
          if [[ "$CACHE_MODE" == warm && "$CACHE_HIT" != true ]]; then
            echo 'Warm producer requires an exact build-cache hit.' >&2
            exit 1
          fi

      - name: Check app locales and Swift formatting
        run: ./Scripts/lint.sh lint-macos

      - name: Prepare compiled test transfer
        run: python3 Scripts/ci_swift_test_artifact.py prepare-transfer

      - name: Build and export macOS tests once
        id: swift-build
        timeout-minutes: 70
        env:
          CODEXBAR_TEST_TOOLCHAIN_ID: ${{ steps.swift-toolchain.outputs.cache-id }}
        run: ./Scripts/test.sh --export-build "$CODEXBAR_TEST_BUILD_ROOT"

      - name: Upload compiled macOS tests
        id: build-upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: swift-test-build-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}-${{ env.CODEXBAR_TEST_PROFILE }}
          path: |
            ${{ env.CODEXBAR_TEST_BUILD_ROOT }}/manifest.json
            ${{ env.CODEXBAR_TEST_BUILD_ROOT }}/build.tar.gz
          include-hidden-files: false
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

      - name: Remove runner-local compiled test transfer
        if: ${{ always() && env.CODEXBAR_TEST_BUILD_ROOT != '' }}
        run: python3 Scripts/ci_swift_test_artifact.py cleanup-transfer

  swift-test-macos:
    name: swift-test-macos (${{ matrix.shard-index }}, ${{ matrix.shard-count }})
    needs: [changes, swift-build-macos]
    if: ${{ needs.changes.outputs.macos-tests == 'true' && needs.changes.outputs.macos-tests-deferred != 'true' }}
    # Apple-Silicon runners: ~2-4x faster Swift builds than the retired-path
    # Intel pool and much shorter queues (see #2585 for the measurements).
    runs-on: macos-26
    timeout-minutes: 80
    strategy:
      fail-fast: false
      # Ordinary CI remains group four / two shards. Only validated manual arms vary.
      matrix: ${{ fromJSON(needs.changes.outputs.macos-matrix) }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Select Xcode 26.3 or 26.2
        run: |
          set -euo pipefail
          # Both versions are part of the official macOS 26 runner image.
          for candidate in /Applications/Xcode_26.3.app /Applications/Xcode_26.2.app; do
            if [[ -d "$candidate" ]]; then
              export DEVELOPER_DIR="${candidate}/Contents/Developer"
              echo "DEVELOPER_DIR=$DEVELOPER_DIR" >> "$GITHUB_ENV"
              break
            fi
          done
          [[ "$(/usr/bin/xcodebuild -version)" == Xcode\ 26.* ]]
          /usr/bin/xcodebuild -version

      - name: Swift toolchain version
        id: swift-toolchain
        shell: bash
        run: |
          set -euo pipefail
          xcode_version="$(/usr/bin/xcodebuild -version)"
          swift_version="$(swift --version)"
          swiftpm_version="$(swift package --version)"
          toolchain_info="$(printf '%s\n' "$xcode_version" "$swift_version" "$swiftpm_version")"
          printf '%s\n' "$toolchain_info"
          cache_id="$(printf '%s\n' "$toolchain_info" | shasum -a 256 | awk '{print $1}')"
          printf 'cache-id=%s\n' "$cache_id" >> "$GITHUB_OUTPUT"
          profile_manifest_sha256="$(python3 -c 'import sys; sys.path.insert(0, "Scripts"); from test_profiles import manifest_digest; print(manifest_digest())')"
          printf 'profile-manifest-sha256=%s\n' "$profile_manifest_sha256" >> "$GITHUB_OUTPUT"

      - name: Prepare campaign evidence
        id: campaign-evidence
        if: ${{ matrix.campaign }}
        env:
          CAMPAIGN_GROUP_SIZE: ${{ matrix.group-size }}
          CAMPAIGN_SHARD_COUNT: ${{ matrix.shard-count }}
          CAMPAIGN_SHARD_INDEX: ${{ matrix.shard-index }}
          CAMPAIGN_EXPECTED_SHA: ${{ inputs.expected_sha }}
          CAMPAIGN_CACHE_MODE: ${{ matrix.cache-mode }}
          CAMPAIGN_CACHE_HIT: ${{ needs.swift-build-macos.outputs.cache-hit }}
          CAMPAIGN_CACHE_KEY: swiftpm-macos26-v3-${{ runner.arch }}-${{ steps.swift-toolchain.outputs.cache-id }}-${{ env.CODEXBAR_TEST_PROFILE }}-${{ steps.swift-toolchain.outputs.profile-manifest-sha256 }}-${{ hashFiles('Package.resolved', 'Package.swift') }}-${{ github.sha }}
          CAMPAIGN_TOOLCHAIN_ID: ${{ steps.swift-toolchain.outputs.cache-id }}
        run: python3 Scripts/ci_swift_test_campaign.py prepare --checkout-sha "$(git rev-parse HEAD)"

      - name: Require producer artifact identity
        env:
          PRODUCER_ARTIFACT_ID: ${{ needs.swift-build-macos.outputs.artifact-id }}
          PRODUCER_MANIFEST_SHA256: ${{ needs.swift-build-macos.outputs.manifest-sha256 }}
        run: |
          [[ "$PRODUCER_ARTIFACT_ID" =~ ^[1-9][0-9]*$ && "$PRODUCER_MANIFEST_SHA256" =~ ^[0-9a-f]{64}$ ]]

      - name: Prepare compiled test transfer
        run: python3 Scripts/ci_swift_test_artifact.py prepare-transfer

      - name: Download exact producer build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          artifact-ids: ${{ needs.swift-build-macos.outputs.artifact-id }}
          path: ${{ env.CODEXBAR_TEST_BUILD_ROOT }}
          merge-multiple: true
          digest-mismatch: error

      - name: Prepare synthetic reset timing captures
        shell: bash
        run: |
          set -euo pipefail
          capture_root="$(mktemp -d "$RUNNER_TEMP/reset-captures.XXXXXX")"
          trap 'rm -rf -- "$capture_root"' ERR
          mkdir "$capture_root/expanded" "$capture_root/credit" "$capture_root/orange"
          {
            printf 'CODEXBAR_RESET_CAPTURE_ROOT=%s\n' "$capture_root"
            printf 'CODEXBAR_CLOCK_RESET_CAPTURE_DIR=%s/expanded\n' "$capture_root"
            printf 'CODEXBAR_RESET_DISPLAY_CAPTURE_DIR=%s/credit\n' "$capture_root"
            printf 'CODEXBAR_RESET_DISPLAY_ORANGE_CAPTURE_DIR=%s/orange\n' "$capture_root"
          } >> "$GITHUB_ENV"
          git rev-parse HEAD > "$capture_root/source-commit.txt"

      - name: Swift Test
        # Keep small batches to reduce SwiftPM process overhead without returning to one aggregate run.
        timeout-minutes: 70
        env:
          CODEXBAR_TEST_EVIDENCE_DIR: ${{ steps.campaign-evidence.outputs.root }}
          CODEXBAR_TEST_TOOLCHAIN_ID: ${{ steps.swift-toolchain.outputs.cache-id }}
          CODEXBAR_TEST_BUILD_MANIFEST_SHA256: ${{ needs.swift-build-macos.outputs.manifest-sha256 }}
        run: |
          extra=()
          if [[ "$CODEXBAR_TEST_PROFILE" == full && '${{ matrix.shard-index }}' == 0 &&
                -d Sources/CodexBarCore/Resources/Plugins ]]; then
            extra+=(--jsc-goldens)
          fi
          CODEXBAR_TEST_GROUP_SIZE=${{ matrix.group-size }} \
            CODEXBAR_TEST_SUITE_TIMEOUT=120 \
            CODEXBAR_TEST_RETRY_NON_TIMEOUT_FAILURES=0 \
            CODEXBAR_TEST_SHARD_INDEX=${{ matrix.shard-index }} \
            CODEXBAR_TEST_SHARD_COUNT=${{ matrix.shard-count }} \
            ./Scripts/test.sh --use-build "$CODEXBAR_TEST_BUILD_ROOT" "${extra[@]}"

      - name: Remove runner-local compiled test transfer
        if: ${{ always() && env.CODEXBAR_TEST_BUILD_ROOT != '' }}
        run: python3 Scripts/ci_swift_test_artifact.py cleanup-transfer

      - name: Upload synthetic reset timing captures
        if: ${{ always() && env.CODEXBAR_RESET_CAPTURE_ROOT != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reset-timing-${{ github.sha }}-${{ matrix.shard-index }}
          path: ${{ env.CODEXBAR_RESET_CAPTURE_ROOT }}
          if-no-files-found: error
          retention-days: 7

      - name: Remove runner-local reset timing captures
        if: ${{ always() && env.CODEXBAR_RESET_CAPTURE_ROOT != '' }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf -- "$CODEXBAR_RESET_CAPTURE_ROOT"
          test ! -e "$CODEXBAR_RESET_CAPTURE_ROOT"

      - name: Collect crash reports on failure
        if: ${{ failure() }}
        shell: bash
        run: |
          set -uo pipefail
          reports="$HOME/Library/Logs/DiagnosticReports"
          found=0
          if [[ -d "$reports" ]]; then
            while IFS= read -r file; do
              found=1
              echo "::group::crash report $(basename "$file")"
              cat "$file"
              echo "::endgroup::"
            done < <(find "$reports" \( -name '*.ips' -o -name '*.crash' \) -newer .git/HEAD -print 2>/dev/null | head -5)
          fi
          [[ "$found" == 1 ]] || echo "no fresh crash reports under $reports"

      - name: Summarize macOS shard
        if: ${{ always() }}
        shell: bash
        env:
          SHARD_INDEX: ${{ matrix.shard-index }}
          SHARD_COUNT: ${{ matrix.shard-count }}
          RUNS_LINT_MACOS: 'false'
        run: |
          set -euo pipefail
          display_shard_index=$((SHARD_INDEX + 1))
          xcode_version="$(/usr/bin/xcodebuild -version 2>/dev/null | tr '\n' ' ' || true)"
          {
            printf '### macOS Swift shard\n\n'
            printf '| Field | Value |\n'
            printf '| --- | --- |\n'
            printf '| Shard | `%s / %s` |\n' "$display_shard_index" "$SHARD_COUNT"
            printf '| Runner | `%s` |\n' "${RUNNER_NAME:-unknown}"
            printf '| Xcode | `%s` |\n' "${xcode_version:-unknown}"
            printf '| Runs lint-macos | `%s` |\n' "$RUNS_LINT_MACOS"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Validate campaign evidence
        if: ${{ always() && steps.campaign-evidence.outputs.root != '' }}
        env:
          CAMPAIGN_ROOT: ${{ steps.campaign-evidence.outputs.root }}
        run: python3 Scripts/ci_swift_test_campaign.py verify "$CAMPAIGN_ROOT"

      - name: Upload campaign evidence
        id: campaign-upload
        if: ${{ always() && steps.campaign-evidence.outputs.root != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: swift-campaign-${{ github.sha }}-g${{ matrix.group-size }}-n${{ matrix.shard-count }}-s${{ matrix.shard-index }}-${{ matrix.cache-mode }}-${{ github.run_attempt }}
          path: ${{ steps.campaign-evidence.outputs.root }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

      - name: Remove uploaded campaign evidence
        if: ${{ always() && steps.campaign-upload.outcome == 'success' }}
        env:
          CAMPAIGN_ROOT: ${{ steps.campaign-evidence.outputs.root }}
        run: python3 Scripts/ci_swift_test_campaign.py cleanup "$CAMPAIGN_ROOT"

  lint-build-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs:
      - changes
      - lint
      - swift-build-macos
      - swift-test-macos
      - build-linux-musl-cli
      - build-linux-cli
    if: ${{ always() && !cancelled() }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Verify required CI jobs
        run: |
          ./Scripts/ci_verify_test_jobs.sh \
            "${{ needs.lint.result }}" \
            "${{ needs.changes.result }}" \
            "${{ needs.changes.outputs.macos-tests }}" \
            "${{ needs.swift-test-macos.result }}" \
            "${{ needs.changes.outputs.macos-tests-deferred }}" \
            "${{ needs.changes.outputs.linux-musl-build }}" \
            "${{ needs.build-linux-musl-cli.result }}" \
            "${{ needs.build-linux-cli.result }}" \
            "${{ needs.changes.outputs.linux-tests }}" \
            "${{ needs.swift-build-macos.result }}"

      - name: Summarize aggregate CI gate
        if: ${{ always() }}
        shell: bash
        env:
          LINT_RESULT: ${{ needs.lint.result }}
          CHANGES_RESULT: ${{ needs.changes.result }}
          MACOS_TESTS: ${{ needs.changes.outputs.macos-tests }}
          MACOS_TESTS_DEFERRED: ${{ needs.changes.outputs.macos-tests-deferred }}
          MACOS_TESTS_REASON: ${{ needs.changes.outputs.macos-tests-reason }}
          MACOS_RESULT: ${{ needs.swift-test-macos.result }}
          MACOS_BUILD_RESULT: ${{ needs.swift-build-macos.result }}
          LINUX_TESTS: ${{ needs.changes.outputs.linux-tests }}
          LINUX_TESTS_REASON: ${{ needs.changes.outputs.linux-tests-reason }}
          LINUX_MUSL_BUILD: ${{ needs.changes.outputs.linux-musl-build }}
          LINUX_MUSL_BUILD_REASON: ${{ needs.changes.outputs.linux-musl-build-reason }}
          LINUX_MUSL_RESULT: ${{ needs.build-linux-musl-cli.result }}
          LINUX_RESULT: ${{ needs.build-linux-cli.result }}
        run: |
          set -euo pipefail
          reason="${MACOS_TESTS_REASON:-<unset>}"
          reason="${reason//|/\\|}"
          linux_reason="${LINUX_TESTS_REASON:-<unset>}"
          linux_reason="${linux_reason//|/\\|}"
          musl_reason="${LINUX_MUSL_BUILD_REASON:-<unset>}"
          musl_reason="${musl_reason//|/\\|}"
          {
            printf '### Aggregate CI gate\n\n'
            printf '| Field | Value |\n'
            printf '| --- | --- |\n'
            printf '| lint result | `%s` |\n' "$LINT_RESULT"
            printf '| changes result | `%s` |\n' "$CHANGES_RESULT"
            printf '| macOS Swift tests required | `%s` |\n' "${MACOS_TESTS:-<unset>}"
            printf '| macOS Swift tests deferred | `%s` |\n' "${MACOS_TESTS_DEFERRED:-<unset>}"
            printf '| macOS gate reason | %s |\n' "$reason"
            printf '| swift-build-macos result | `%s` |\n' "$MACOS_BUILD_RESULT"
            printf '| swift-test-macos result | `%s` |\n' "$MACOS_RESULT"
            printf '| Linux glibc tests required | `%s` |\n' "${LINUX_TESTS:-<unset>}"
            printf '| Linux glibc reason | %s |\n' "$linux_reason"
            printf '| Linux musl build required | `%s` |\n' "${LINUX_MUSL_BUILD:-<unset>}"
            printf '| Linux musl gate reason | %s |\n' "$musl_reason"
            printf '| build-linux-musl-cli result | `%s` |\n' "$LINUX_MUSL_RESULT"
            printf '| build-linux-cli matrix result | `%s` |\n' "$LINUX_RESULT"
          } >> "$GITHUB_STEP_SUMMARY"

  build-linux-musl-cli:
    needs: changes
    if: ${{ needs.changes.outputs.linux-musl-build == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SWIFT_VERSION: 6.2.1
      SWIFT_STATIC_LINUX_SDK: swift-6.2.1-RELEASE_static-linux-0.0.1
      SWIFT_STATIC_LINUX_SDK_TRIPLE: x86_64-swift-linux-musl
      SWIFT_STATIC_LINUX_SDK_ARCH: x86_64
      SWIFT_STATIC_LINUX_SDK_URL: https://download.swift.org/swift-6.2.1-release/static-sdk/swift-6.2.1-RELEASE/swift-6.2.1-RELEASE_static-linux-0.0.1.artifactbundle.tar.gz
      SWIFT_STATIC_LINUX_SDK_CHECKSUM: 08e1939a504e499ec871b36826569173103e4562769e12b9b8c2a50f098374ad
      SQLITE_AMALGAMATION_VERSION: "3530300"
      SQLITE_AMALGAMATION_SHA3_256: d45c688a8cb23f68611a894a756a12d7eb6ab6e9e2468ca70adbeab3808b5ab9
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Runner info
        run: |
          set -euo pipefail
          uname -a
          uname -m
          swift --version

      - name: Install Swift ${{ env.SWIFT_VERSION }} via swiftly
        shell: bash
        run: |
          set -euo pipefail

          if ! command -v gpg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ca-certificates gpg
          fi

          SWIFTLY_ARCH="$(uname -m)"
          SWIFTLY_ARCHIVE="$RUNNER_TEMP/swiftly-${SWIFTLY_VERSION}-${SWIFTLY_ARCH}.tar.gz"
          SWIFTLY_SIGNATURE="${SWIFTLY_ARCHIVE}.sig"
          SWIFTLY_HOME_DIR="$HOME/.local/share/swiftly"
          SWIFTLY_BIN_DIR="$HOME/.local/bin"
          SWIFT_GNUPGHOME="$(mktemp -d)"
          SWIFT_KEYS="$RUNNER_TEMP/swift-signing-keys.asc"
          POST_INSTALL_SCRIPT="$(mktemp)"

          mkdir -p "$SWIFTLY_BIN_DIR"
          chmod 700 "$SWIFT_GNUPGHOME"
          curl -fsSL "https://download.swift.org/swiftly/linux/swiftly-${SWIFTLY_VERSION}-${SWIFTLY_ARCH}.tar.gz" -o "$SWIFTLY_ARCHIVE"
          curl -fsSL "https://download.swift.org/swiftly/linux/swiftly-${SWIFTLY_VERSION}-${SWIFTLY_ARCH}.tar.gz.sig" -o "$SWIFTLY_SIGNATURE"
          curl -fsSL --compressed "https://www.swift.org/keys/all-keys.asc" -o "$SWIFT_KEYS"
          GNUPGHOME="$SWIFT_GNUPGHOME" gpg --batch --import "$SWIFT_KEYS"
          SIGNATURE_STATUS="$(GNUPGHOME="$SWIFT_GNUPGHOME" gpg --batch --status-fd=1 \
            --verify "$SWIFTLY_SIGNATURE" "$SWIFTLY_ARCHIVE" 2>&1)"
          printf '%s\n' "$SIGNATURE_STATUS"
          grep -Fq "[GNUPG:] VALIDSIG ${SWIFTLY_SIGNING_FINGERPRINT} " <<< "$SIGNATURE_STATUS"
          tar -xzf "$SWIFTLY_ARCHIVE" -C /tmp
          /tmp/swiftly init --assume-yes --skip-install

          . "$SWIFTLY_HOME_DIR/env.sh"
          echo "$SWIFTLY_BIN_DIR" >> "$GITHUB_PATH"
          echo "SWIFTLY_HOME_DIR=$SWIFTLY_HOME_DIR" >> "$GITHUB_ENV"
          echo "SWIFTLY_BIN_DIR=$SWIFTLY_BIN_DIR" >> "$GITHUB_ENV"

          swiftly install "$SWIFT_VERSION" --use --assume-yes --verify --post-install-file "$POST_INSTALL_SCRIPT"
          if [[ -s "$POST_INSTALL_SCRIPT" ]]; then
            sudo apt-get update
            sudo bash "$POST_INSTALL_SCRIPT"
          fi

          hash -r
          swift --version

      - name: Install Swift Static Linux SDK
        shell: bash
        run: |
          set -euo pipefail
          swift sdk install "$SWIFT_STATIC_LINUX_SDK_URL" --checksum "$SWIFT_STATIC_LINUX_SDK_CHECKSUM"
          swift sdk list | grep -Fx "$SWIFT_STATIC_LINUX_SDK"

          sdk_root="$(
            find "$HOME" -type d -path "*/${SWIFT_STATIC_LINUX_SDK}.artifactbundle/${SWIFT_STATIC_LINUX_SDK}/swift-linux-musl" | head -n1
          )"
          if [[ -z "$sdk_root" ]]; then
            echo "Swift SDK root not found." >&2
            exit 1
          fi

          python3 - "$sdk_root/swift-sdk.json" "$SWIFT_STATIC_LINUX_SDK_TRIPLE" <<'PY'
          import json
          import sys

          sdk_json_path, target_triple = sys.argv[1], sys.argv[2]
          with open(sdk_json_path, encoding="utf-8") as handle:
              sdk_json = json.load(handle)

          target_triples = sdk_json.get("targetTriples", {})
          if target_triple not in target_triples:
              raise SystemExit(f"Swift SDK target triple not found: {target_triple}")

          sdk_json["targetTriples"] = {target_triple: target_triples[target_triple]}
          with open(sdk_json_path, "w", encoding="utf-8") as handle:
              json.dump(sdk_json, handle, indent=2)
              handle.write("\n")
          PY

          for sdk_arch in "$sdk_root"/musl-1.2.5.sdk/*; do
            if [[ "$(basename "$sdk_arch")" != "$SWIFT_STATIC_LINUX_SDK_ARCH" ]]; then
              rm -rf "$sdk_arch"
            fi
          done

      - name: Build static SQLite for musl SDK
        shell: bash
        run: |
          set -euo pipefail

          missing_packages=()
          for tool in clang openssl unzip; do
            if ! command -v "$tool" >/dev/null 2>&1; then
              missing_packages+=("$tool")
            fi
          done
          if [[ "${#missing_packages[@]}" -gt 0 ]]; then
            sudo apt-get update
            sudo apt-get install -y "${missing_packages[@]}"
          fi

          sqlite_zip="$RUNNER_TEMP/sqlite-amalgamation-${SQLITE_AMALGAMATION_VERSION}.zip"
          sqlite_src="$RUNNER_TEMP/sqlite-src"
          sqlite_out="$RUNNER_TEMP/sqlite-${SWIFT_STATIC_LINUX_SDK_TRIPLE}"

          curl -fsSL "https://www.sqlite.org/2026/sqlite-amalgamation-${SQLITE_AMALGAMATION_VERSION}.zip" -o "$sqlite_zip"
          actual_sha3="$(openssl dgst -sha3-256 "$sqlite_zip" | awk '{print $NF}')"
          if [[ "$actual_sha3" != "$SQLITE_AMALGAMATION_SHA3_256" ]]; then
            echo "SQLite amalgamation checksum mismatch: $actual_sha3" >&2
            exit 1
          fi

          rm -rf "$sqlite_src" "$sqlite_out"
          mkdir -p "$sqlite_src" "$sqlite_out/build" "$sqlite_out/lib"
          unzip -q "$sqlite_zip" -d "$sqlite_src"

          sdk_bundle="$(
            find "$HOME" -type d -name "${SWIFT_STATIC_LINUX_SDK}.artifactbundle" | head -n1
          )"
          if [[ -z "$sdk_bundle" ]]; then
            echo "Swift SDK artifact bundle not found." >&2
            exit 1
          fi
          sysroot="$sdk_bundle/$SWIFT_STATIC_LINUX_SDK/swift-linux-musl/musl-1.2.5.sdk/$SWIFT_STATIC_LINUX_SDK_ARCH"
          if [[ ! -d "$sysroot" ]]; then
            echo "Swift SDK sysroot not found: $sysroot" >&2
            exit 1
          fi

          sqlite_amalgamation="$sqlite_src/sqlite-amalgamation-${SQLITE_AMALGAMATION_VERSION}"
          mkdir -p "$sysroot/usr/include"
          install -m 0644 "$sqlite_amalgamation/sqlite3.h" "$sysroot/usr/include/sqlite3.h"

          clang \
            -target "$SWIFT_STATIC_LINUX_SDK_TRIPLE" \
            --sysroot="$sysroot" \
            -O2 \
            -DSQLITE_OMIT_LOAD_EXTENSION=1 \
            -c "$sqlite_amalgamation/sqlite3.c" \
            -o "$sqlite_out/build/sqlite3.o"
          llvm-ar crs "$sqlite_out/lib/libsqlite3.a" "$sqlite_out/build/sqlite3.o"

          echo "CODEXBAR_SQLITE3_LIB_DIR=$sqlite_out/lib" >> "$GITHUB_ENV"

      - name: Build CodexBarCLI (PR debug; main/manual release, Linux musl x86_64)
        env:
          MUSL_BUILD_CONFIGURATION: ${{ github.event_name == 'pull_request' && 'debug' || 'release' }}
        run: |
          set -euo pipefail
          swift build -c "$MUSL_BUILD_CONFIGURATION" --product CodexBarCLI \
            --swift-sdk "$SWIFT_STATIC_LINUX_SDK" \
            --triple "$SWIFT_STATIC_LINUX_SDK_TRIPLE"
          bin_path="$(swift build -c "$MUSL_BUILD_CONFIGURATION" --show-bin-path \
            --swift-sdk "$SWIFT_STATIC_LINUX_SDK" \
            --triple "$SWIFT_STATIC_LINUX_SDK_TRIPLE")"
          program_headers="$(readelf --program-headers "$bin_path/CodexBarCLI")"
          dynamic_section="$(readelf --dynamic "$bin_path/CodexBarCLI")"
          if grep -Eq '(^|[[:space:]])INTERP([[:space:]]|$)' <<< "$program_headers" || \
            grep -Fq '(NEEDED)' <<< "$dynamic_section"; then
            echo "Musl CLI unexpectedly requires a dynamic loader or library." >&2
            exit 1
          fi
          printf 'Musl CLI configuration: %s; static linkage verified\n' "$MUSL_BUILD_CONFIGURATION"

  build-linux-cli:
    needs: changes
    if: ${{ needs.changes.outputs.linux-tests == 'true' }}
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            runs-on: ubuntu-24.04
          - name: linux-arm64
            runs-on: ubuntu-24.04-arm
    runs-on: ${{ matrix.runs-on }}
    env:
      CAMPAIGN_EXPECTED_SHA: ${{ inputs.expected_sha }}
      CAMPAIGN_GROUP_SIZE: ${{ inputs.group_size }}
      CAMPAIGN_SHARD_COUNT: ${{ inputs.shard_count }}
      CAMPAIGN_CACHE_MODE: ${{ inputs.cache_mode }}
      LINUX_CACHE_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.linux_cache_mode || 'auto' }}
      LINUX_TIMESTAMP_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.linux_timestamp_mode || 'off' }}
      LINUX_BUILD_CONFIGURATION: ${{ github.event_name == 'pull_request' && 'debug' || 'release' }}
      LINUX_RUNNER_LABEL: ${{ matrix.runs-on }}
      LINUX_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Validate Linux campaign source
        id: linux-cache-source
        run: python3 Scripts/ci_swift_test_campaign.py linux-cache source --checkout-sha "$(git rev-parse HEAD)"

      - name: Runner info
        run: |
          set -euo pipefail
          uname -a
          uname -m

      - name: Restore Swift toolchain cache
        id: swift-toolchain-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/swiftly
          key: swift-${{ runner.os }}-${{ runner.arch }}-${{ env.SWIFT_VERSION }}-swiftly-${{ env.SWIFTLY_VERSION }}

      - name: Install Swift ${{ env.SWIFT_VERSION }} via swiftly
        shell: bash
        run: |
          set -euo pipefail

          missing_packages=()
          for package in ca-certificates gpg libcurl4-openssl-dev; do
            if ! dpkg-query -W -f='${Status}' "$package" 2>/dev/null | grep -q "install ok installed"; then
              missing_packages+=("$package")
            fi
          done
          if [[ "${#missing_packages[@]}" -gt 0 ]]; then
            sudo apt-get update
            sudo apt-get install -y "${missing_packages[@]}"
          fi

          SWIFTLY_ARCH="$(uname -m)"
          SWIFTLY_ARCHIVE="$RUNNER_TEMP/swiftly-${SWIFTLY_VERSION}-${SWIFTLY_ARCH}.tar.gz"
          SWIFTLY_SIGNATURE="${SWIFTLY_ARCHIVE}.sig"
          SWIFTLY_HOME_DIR="$HOME/.local/share/swiftly"
          SWIFTLY_BIN_DIR="$HOME/.local/bin"
          SWIFT_GNUPGHOME="$(mktemp -d)"
          SWIFT_KEYS="$RUNNER_TEMP/swift-signing-keys.asc"
          POST_INSTALL_SCRIPT="$(mktemp)"

          mkdir -p "$SWIFTLY_BIN_DIR"
          chmod 700 "$SWIFT_GNUPGHOME"
          echo "Swift toolchain cache hit: ${{ steps.swift-toolchain-cache.outputs.cache-hit }}"
          curl -fsSL "https://download.swift.org/swiftly/linux/swiftly-${SWIFTLY_VERSION}-${SWIFTLY_ARCH}.tar.gz" -o "$SWIFTLY_ARCHIVE"
          curl -fsSL "https://download.swift.org/swiftly/linux/swiftly-${SWIFTLY_VERSION}-${SWIFTLY_ARCH}.tar.gz.sig" -o "$SWIFTLY_SIGNATURE"
          curl -fsSL --compressed "https://www.swift.org/keys/all-keys.asc" -o "$SWIFT_KEYS"
          GNUPGHOME="$SWIFT_GNUPGHOME" gpg --batch --import "$SWIFT_KEYS"
          SIGNATURE_STATUS="$(GNUPGHOME="$SWIFT_GNUPGHOME" gpg --batch --status-fd=1 \
            --verify "$SWIFTLY_SIGNATURE" "$SWIFTLY_ARCHIVE" 2>&1)"
          printf '%s\n' "$SIGNATURE_STATUS"
          grep -Fq "[GNUPG:] VALIDSIG ${SWIFTLY_SIGNING_FINGERPRINT} " <<< "$SIGNATURE_STATUS"
          tar -xzf "$SWIFTLY_ARCHIVE" -C /tmp
          /tmp/swiftly init --assume-yes --skip-install

          . "$SWIFTLY_HOME_DIR/env.sh"
          echo "$SWIFTLY_BIN_DIR" >> "$GITHUB_PATH"
          echo "SWIFTLY_HOME_DIR=$SWIFTLY_HOME_DIR" >> "$GITHUB_ENV"
          echo "SWIFTLY_BIN_DIR=$SWIFTLY_BIN_DIR" >> "$GITHUB_ENV"

          swiftly install "$SWIFT_VERSION" --use --assume-yes --verify --post-install-file "$POST_INSTALL_SCRIPT"
          if [[ -s "$POST_INSTALL_SCRIPT" ]]; then
            sudo apt-get update
            sudo bash "$POST_INSTALL_SCRIPT"
          fi

          hash -r
          swift --version

      - name: Plan Linux application cache
        id: linux-cache-plan
        timeout-minutes: 1
        env:
          LINUX_CACHE_CONTEXT: ${{ steps.linux-cache-source.outputs.context }}
        run: python3 Scripts/ci_swift_test_campaign.py linux-cache plan

      - name: Look up Linux application cache
        id: linux-cache-lookup
        if: ${{ steps.linux-cache-plan.outputs.enabled == 'true' }}
        continue-on-error: true
        timeout-minutes: 2
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build
          key: ${{ steps.linux-cache-plan.outputs.key }}
          restore-keys: ${{ steps.linux-cache-plan.outputs.restore-prefix }}
          lookup-only: true

      - name: Approve Linux cache metadata and storage
        id: linux-cache-approve
        if: ${{ steps.linux-cache-plan.outputs.enabled == 'true' }}
        timeout-minutes: 1
        env:
          LINUX_CACHE_CONTEXT: ${{ steps.linux-cache-plan.outputs.context }}
          LINUX_LOOKUP_OUTCOME: ${{ steps.linux-cache-lookup.outcome }}
          LINUX_MATCHED_KEY: ${{ steps.linux-cache-lookup.outputs.cache-matched-key }}
          GH_TOKEN: ${{ github.token }}
        run: python3 Scripts/ci_swift_test_campaign.py linux-cache approve-restore

      - name: Restore approved Linux application cache
        id: linux-cache-restore
        if: ${{ steps.linux-cache-approve.outputs.restore == 'true' }}
        continue-on-error: true
        timeout-minutes: 2
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        env:
          SEGMENT_DOWNLOAD_TIMEOUT_MINS: '1'
        with:
          path: .build
          key: ${{ steps.linux-cache-approve.outputs.approved-key }}
          fail-on-cache-miss: true

      - name: Verify restored Linux application cache
        id: linux-cache-restored
        if: ${{ always() && steps.linux-cache-approve.outputs.restore == 'true' }}
        timeout-minutes: 1
        env:
          LINUX_CACHE_CONTEXT: ${{ steps.linux-cache-approve.outputs.context }}
          LINUX_RESTORE_OUTCOME: ${{ steps.linux-cache-restore.outcome }}
          LINUX_RESTORED_KEY: ${{ steps.linux-cache-restore.outputs.cache-matched-key }}
          GH_TOKEN: ${{ github.token }}
        run: python3 Scripts/ci_swift_test_campaign.py linux-cache after-restore

      - name: Prepare experimental Linux input timestamps
        id: linux-input-timestamps
        if: ${{ env.LINUX_TIMESTAMP_MODE != 'off' }}
        timeout-minutes: 1
        env:
          LINUX_CACHE_CONTEXT: ${{ steps.linux-cache-restored.outputs.context || steps.linux-cache-approve.outputs.context || steps.linux-cache-plan.outputs.context }}
        run: python3 Scripts/ci_swift_test_campaign.py linux-cache input-timestamps

      - name: Observe Linux build storage before release
        id: linux-before-release
        env:
          LINUX_CACHE_ACTIVE: ${{ steps.linux-cache-plan.outputs.enabled }}
        run: python3 Scripts/ci_swift_test_campaign.py measure-linux --phase before-release --step-times

      - name: Build CodexBarCLI (PR debug; main/manual release with static Swift stdlib)
        # Keep the campaign step ID stable; the summary records the actual configuration.
        id: linux-release
        shell: bash
        run: |
          set -euo pipefail
          build_args=(-c "$LINUX_BUILD_CONFIGURATION" --product CodexBarCLI)
          if [[ "$LINUX_BUILD_CONFIGURATION" == release ]]; then
            build_args+=(--static-swift-stdlib)
          fi
          swift build "${build_args[@]}"

      - name: Observe Linux build storage after release
        id: linux-after-release
        if: ${{ always() }}
        env:
          LINUX_CACHE_ACTIVE: ${{ steps.linux-cache-plan.outputs.enabled }}
        run: python3 Scripts/ci_swift_test_campaign.py measure-linux --phase after-release --step-times

      - name: Swift Test (Linux only)
        id: linux-tests
        run: ./Scripts/test.sh --parallel

      - name: Observe Linux build storage after tests
        id: linux-after-tests
        if: ${{ always() }}
        env:
          LINUX_CACHE_ACTIVE: ${{ steps.linux-cache-plan.outputs.enabled }}
        run: python3 Scripts/ci_swift_test_campaign.py measure-linux --phase after-tests --step-times

      - name: Smoke test CodexBarCLI
        id: linux-smoke
        shell: bash
        run: |
          set -euo pipefail
          build_args=(-c "$LINUX_BUILD_CONFIGURATION" --product CodexBarCLI)
          if [[ "$LINUX_BUILD_CONFIGURATION" == release ]]; then
            build_args+=(--static-swift-stdlib)
          fi
          BIN_DIR="$(swift build "${build_args[@]}" --show-bin-path)"
          BIN="$BIN_DIR/CodexBarCLI"
          "$BIN" --help >/dev/null
          "$BIN" --version >/dev/null
          if smoke_error="$("$BIN" usage --provider codex --web 2>&1)"; then
            echo "Expected --web to fail on Linux"
            exit 1
          fi
          grep -q "macOS" <<< "$smoke_error"

      - name: Admit Linux application cache save
        id: linux-cache-save-plan
        if: ${{ always() && steps.linux-cache-source.outputs.context != '' }}
        timeout-minutes: 1
        env:
          LINUX_CACHE_CONTEXT: ${{ steps.linux-input-timestamps.outputs.context || steps.linux-cache-restored.outputs.context || steps.linux-cache-approve.outputs.context || steps.linux-cache-plan.outputs.context || steps.linux-cache-source.outputs.context }}
          LINUX_RELEASE_OUTCOME: ${{ steps.linux-release.outcome }}
          LINUX_TESTS_OUTCOME: ${{ steps.linux-tests.outcome }}
          LINUX_SMOKE_OUTCOME: ${{ steps.linux-smoke.outcome }}
          LINUX_BEFORE_RELEASE_END: ${{ steps.linux-before-release.outputs.finished-at }}
          LINUX_AFTER_RELEASE_START: ${{ steps.linux-after-release.outputs.started-at }}
          LINUX_AFTER_RELEASE_END: ${{ steps.linux-after-release.outputs.finished-at }}
          LINUX_AFTER_TESTS_START: ${{ steps.linux-after-tests.outputs.started-at }}
          LINUX_AFTER_TESTS_END: ${{ steps.linux-after-tests.outputs.finished-at }}
        run: python3 Scripts/ci_swift_test_campaign.py linux-cache before-save

      - name: Save admitted Linux application cache
        id: linux-cache-save
        if: ${{ steps.linux-cache-save-plan.outputs.save == 'true' }}
        continue-on-error: true
        timeout-minutes: 2
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        env:
          SEGMENT_DOWNLOAD_TIMEOUT_MINS: '1'
        with:
          path: .build
          key: ${{ steps.linux-cache-save-plan.outputs.key }}

      - name: Record Linux cache publication availability
        if: ${{ always() && steps.linux-cache-save-plan.outputs.context != '' }}
        timeout-minutes: 1
        env:
          LINUX_CACHE_CONTEXT: ${{ steps.linux-cache-save-plan.outputs.context }}
          LINUX_SAVE_OUTCOME: ${{ steps.linux-cache-save.outcome }}
          GH_TOKEN: ${{ github.token }}
        run: python3 Scripts/ci_swift_test_campaign.py linux-cache after-save

      - name: Summarize Linux CLI build
        if: ${{ always() }}
        shell: bash
        env:
          MATRIX_NAME: ${{ matrix.name }}
          MATRIX_RUNS_ON: ${{ matrix.runs-on }}
          SWIFT_CACHE_HIT: ${{ steps.swift-toolchain-cache.outputs.cache-hit }}
        run: |
          set -euo pipefail
          {
            printf '### Linux CLI build\n\n'
            printf '| Field | Value |\n'
            printf '| --- | --- |\n'
            printf '| Matrix | `%s` |\n' "$MATRIX_NAME"
            printf '| Runner label | `%s` |\n' "$MATRIX_RUNS_ON"
            printf '| Swift version | `%s` |\n' "$SWIFT_VERSION"
            printf '| CLI build configuration | `%s` |\n' "$LINUX_BUILD_CONFIGURATION"
            printf '| Swift toolchain cache hit | `%s` |\n' "${SWIFT_CACHE_HIT:-false}"
          } >> "$GITHUB_STEP_SUMMARY"
